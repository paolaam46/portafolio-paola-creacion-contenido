<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paola | Communication Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero__container">
                <div class="hero__content">
                    <h1 class="hero__title"></h1>
                    <p class="hero__subtitle"></p>
                    <p class="hero__description"></p>
                    <div class="hero__actions"></div>
                </div>
                <div class="hero__image"></div>
            </div>
        </section>

        <section class="about">
            <div class="about__container">
                <div class="about__content">
                    <h2 class="about__title"></h2>
                    <p class="about__description"></p>
                </div>
            </div>
        </section>

        <section class="contact">
            <div class="contact__container">
                <div class="contact__content">
                    <h2 class="contact__title"></h2>
                    <div class="contact__actions"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__content"></div>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
</body>
</html>
